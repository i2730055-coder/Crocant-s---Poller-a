
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Crocant's</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body.login {
            margin: 0;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
        }

        .login-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .login-imagen {
            position: relative;
            width: 50%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1c1713;
        }

        .login-imagen-fondo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .login-imagen::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.58),
                rgba(0, 0, 0, 0.25)
            );
            z-index: 1;
        }

        .login-imagen-contenido {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 620px;
            padding: 60px;
            color: #ffffff;
        }

        .login-marca {
            margin-bottom: 35px;
        }

        .login-marca img {
            width: 115px;
            height: 115px;
            object-fit: contain;
            display: block;
            background: #ffffff;
            border-radius: 14px;
            padding: 9px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .login-imagen-contenido h1 {
            margin: 0 0 18px;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(42px, 4.5vw, 68px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -1.5px;
            color: #ffffff;
        }

        .login-imagen-contenido p {
            margin: 0;
            max-width: 550px;
            color: rgba(255, 255, 255, 0.94);
            font-size: 20px;
            font-weight: 500;
            line-height: 1.6;
        }

        .login-linea {
            width: 75px;
            height: 5px;
            margin: 0 0 25px;
            background: #f58220;
            border-radius: 20px;
        }

        .login-formulario {
            width: 50%;
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .login-formulario-contenido {
            width: 100%;
            max-width: 590px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-logo img {
            width: 105px;
            height: 105px;
            object-fit: contain;
            display: inline-block;
        }

        .titulo-login {
            margin: 0 0 35px;
            text-align: center;
            color: #222222;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-label {
            display: block;
            margin-bottom: 9px;
            color: #454545;
            font-size: 15px;
            font-weight: 700;
        }

        .login-campo {
            margin-bottom: 22px;
        }

        .login-input {
            width: 100%;
            height: 58px;
            padding: 0 18px;
            border: 1px solid #d9d9d9;
            border-radius: 10px;
            outline: none;
            color: #333333;
            background: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-input:focus {
            border-color: #f58220;
            box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.12);
        }

        .login-input::placeholder {
            color: #9ca3af;
        }

        .password-contenedor {
            position: relative;
        }

        .password-contenedor .login-input {
            padding-right: 55px;
        }

        .btn-mostrar-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.2s ease;
        }

        .btn-mostrar-password:hover {
            color: #f58220;
            background: rgba(245, 130, 32, 0.08);
        }

        .login-opciones {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
            margin-bottom: 27px;
        }

        .recordarme {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666666;
            font-size: 14px;
            cursor: pointer;
        }

        .recordarme input {
            width: 17px;
            height: 17px;
            accent-color: #f58220;
            cursor: pointer;
        }

        .link-login {
            color: #555555;
            font-size: 14px;
            font-weight: 600;
            text-decoration: underline;
            transition: 0.2s ease;
        }

        .link-login:hover {
            color: #f58220;
        }

        .btn-login {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 30px;
            background: #f58220;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 130, 32, 0.25);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            background: #ff9638;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(245, 130, 32, 0.30);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .mensaje-login {
            border-radius: 9px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Botón para iniciar sesión con Google */
        .login-separador-google {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0 18px;
            color: #888888;
            font-size: 13px;
            font-weight: 600;
        }

        .login-separador-google::before,
        .login-separador-google::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e5e5;
        }

        .btn-google {
            width: 100%;
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 18px;
            border: 1px solid #dadce0;
            border-radius: 30px;
            background: #ffffff;
            color: #3c4043;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-google:hover {
            background: #f8faff;
            color: #202124;
            box-shadow: 0 2px 7px rgba(60, 64, 67, 0.18);
        }

        .btn-google i {
            font-size: 19px;
            color: #4285f4;
        }

        .registro-login {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eeeeee;
            text-align: center;
            color: #666666;
            font-size: 14px;
        }

        .registro-login a {
            color: #f58220;
            font-weight: 800;
            transition: 0.2s ease;
        }

        .registro-login a:hover {
            color: #d9670b;
        }

        .volver-login {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #777777;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .volver-login:hover {
            color: #f58220;
        }

        @media (max-width: 1100px) {
            .login-imagen-contenido {
                padding: 45px;
            }

            .login-formulario {
                padding: 40px;
            }

            .login-imagen-contenido h1 {
                font-size: 48px;
            }
        }

        @media (max-width: 900px) {
            .login-container {
                flex-direction: column;
                overflow: visible;
            }

            .login-imagen {
                width: 100%;
                min-height: 430px;
                height: 430px;
            }

            .login-imagen-contenido {
                padding: 40px 35px;
            }

            .login-formulario {
                width: 100%;
                min-height: auto;
                padding: 55px 30px;
            }
        }

        @media (max-width: 600px) {
            .login-imagen {
                min-height: 360px;
                height: 360px;
            }

            .login-imagen-contenido {
                padding: 30px 25px;
            }

            .login-marca {
                margin-bottom: 25px;
            }

            .login-marca img {
                width: 85px;
                height: 85px;
            }

            .login-imagen-contenido h1 {
                font-size: 39px;
                letter-spacing: -1px;
            }

            .login-imagen-contenido p {
                font-size: 16px;
            }

            .login-formulario {
                padding: 40px 22px;
            }

            .login-logo img {
                width: 90px;
                height: 90px;
            }

            .titulo-login {
                font-size: 27px;
                margin-bottom: 30px;
            }

            .login-opciones {
                flex-direction: column;
                align-items: flex-start;
                gap: 13px;
            }
        }
    </style>
</head>

<body class="login">
    <div class="login-container">

        <!-- Parte izquierda -->
        <section class="login-imagen">
            <img
                src="{{ url_for('static', filename='img/login-crocants.jpg') }}"
                alt="Crocant's Pollería"
                class="login-imagen-fondo"
            >

            <div class="login-imagen-contenido">
                <div class="login-linea"></div>

                <h1>
                    Bienvenido<br>
                    de nuevo
                </h1>

                <p>
                    ¿Listo para disfrutar el mejor sabor
                    de Crocant's?
                </p>
            </div>
        </section>

        <!-- Parte derecha -->
        <section class="login-formulario">
            <div class="login-formulario-contenido">

                <div class="login-logo">
                    <img
                        src="{{ url_for('static', filename='img/logo-crocants.png') }}"
                        alt="Crocant's"
                    >
                </div>

                <h2 class="titulo-login">Iniciar Sesión</h2>

                {% if error %}
                    <div class="alert alert-danger text-center mensaje-login">
                        {{ error }}
                    </div>
                {% endif %}

                {% if mensaje %}
                    <div class="alert alert-success text-center mensaje-login">
                        {{ mensaje }}
                    </div>
                {% endif %}

                <!-- Formulario original de correo y contraseña -->
                <form method="POST">

                    <div class="login-campo">
                        <label class="login-label" for="correo">
                            Correo Electrónico
                        </label>

                        <input
                            type="email"
                            name="correo"
                            id="correo"
                            class="login-input"
                            placeholder="Ingresa tu correo electrónico"
                            required
                            autofocus
                        >
                    </div>

                    <div class="login-campo">
                        <label class="login-label" for="clave">
                            Contraseña
                        </label>

                        <div class="password-contenedor">
                            <input
                                type="password"
                                name="clave"
                                id="clave"
                                class="login-input"
                                placeholder="Ingresa tu contraseña"
                                required
                            >

                            <button
                                type="button"
                                class="btn-mostrar-password"
                                onclick="mostrarPassword()"
                                aria-label="Mostrar contraseña"
                            >
                                <i
                                    class="bi bi-eye"
                                    id="icono-password"
                                ></i>
                            </button>
                        </div>
                    </div>

                    <div class="login-opciones">
                        <label class="recordarme">
                            <input type="checkbox" name="recordarme">
                            Recordarme
                        </label>

                        <!-- Ruta conservada para evitar el BuildError -->
                        <a href="/recuperar_clave" class="link-login">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <button type="submit" class="btn-login">
                        Iniciar Sesión
                    </button>
                </form>

                <!-- Inicio de sesión con Google -->
                <div class="login-separador-google">
                    O continúa con
                </div>

                <a href="/auth/google" class="btn-google">
                    <i class="bi bi-google" aria-hidden="true"></i>
                    <span>Continuar con Google</span>
                </a>

                <!-- Registro original -->
                <div class="registro-login">
                    ¿No tienes cuenta?
                    <a href="/registro">Regístrate aquí</a>
                </div>

                <!-- Volver al inicio -->
                <a href="/" class="volver-login">
                    <i class="bi bi-arrow-left"></i>
                    Volver al inicio
                </a>

            </div>
        </section>
    </div>

    <script>
        function mostrarPassword() {
            const input = document.getElementById("clave");
            const icono = document.getElementById("icono-password");

            if (input.type === "password") {
                input.type = "text";
                icono.classList.remove("bi-eye");
                icono.classList.add("bi-eye-slash");
            } else {
                input.type = "password";
                icono.classList.remove("bi-eye-slash");
                icono.classList.add("bi-eye");
            }
        }
    </script>

<script 
src="{{ url_for('static', filename='js/bloqueo_botones.js') }}">
</script>


</body>
</html>
