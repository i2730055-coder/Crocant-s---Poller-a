<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pago realizado | CROCANT'S</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --naranja: #f58220;
            --naranja-hover: #ff9638;
            --navbar: #1c1713;
            --fondo: #f7f7f5;
            --texto: #111111;
            --gris: #777d8a;
            --borde: #e7e3df;
            --blanco: #ffffff;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            background: var(--fondo);

            color: var(--texto);

            font-family: 'Montserrat', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }


        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .box {

            width: 100%;
            max-width: 620px;

            background: var(--blanco);

            padding: 45px;

            border-radius: 22px;

            text-align: center;

            border: 1px solid var(--borde);

            box-shadow:
                0 15px 45px rgba(28, 23, 19, 0.10);

            position: relative;

            overflow: hidden;
        }


        /* Línea naranja superior */

        .box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background: linear-gradient(
                90deg,
                var(--naranja),
                var(--naranja-hover)
            );
        }


        /* =====================================================
           ICONO
        ===================================================== */

        .icono-pago {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fff1e5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            color: var(--naranja);
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        h1 {

            margin: 0;

            color: var(--naranja);

            font-size: 36px;

            font-weight: 900;

            letter-spacing: -1px;
        }


        .mensaje {

            margin-top: 14px;

            margin-bottom: 0;

            color: var(--gris);

            font-size: 15px;

            font-weight: 500;
        }


        /* =====================================================
           DETALLE DEL PEDIDO
        ===================================================== */

        .detalle {

            background: #faf8f6;

            padding: 24px;

            border-radius: 16px;

            margin-top: 28px;

            text-align: left;

            border: 1px solid #eee8e2;
        }


        .detalle p {

            margin: 0;

            padding: 13px 0;

            color: #555;

            font-size: 14px;

            border-bottom: 1px solid #eee8e2;
        }


        .detalle p:last-child {

            border-bottom: none;

            padding-bottom: 0;
        }


        .detalle p:first-child {

            padding-top: 0;
        }


        .detalle b {

            color: var(--texto);

            font-weight: 800;
        }


        /* =====================================================
           TOTAL
        ===================================================== */

        .detalle .total {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-top: 5px;
        }


        .detalle .total strong {

            color: var(--naranja);

            font-size: 23px;

            font-weight: 900;
        }


        /* =====================================================
           ESTADO
        ===================================================== */

        .estado {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 12px;

            border-radius: 20px;

            background: #eaf8ef;

            color: #25834b;

            font-size: 12px;

            font-weight: 800;
        }


        /* =====================================================
           BOTÓN PRINCIPAL
        ===================================================== */

        .btn-main {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            width: 100%;

            margin-top: 28px;

            padding: 15px 20px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                var(--naranja),
                var(--naranja-hover)
            );

            color: white;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            transition: all 0.25s ease;

            box-shadow:
                0 8px 20px rgba(245, 130, 32, 0.20);
        }


        .btn-main:hover {

            color: white;

            background: linear-gradient(
                135deg,
                var(--naranja-hover),
                var(--naranja)
            );

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(245, 130, 32, 0.28);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .box {
                padding: 32px 22px;
            }

            h1 {
                font-size: 29px;
            }

            .detalle {
                padding: 20px;
            }

            .detalle .total {
                align-items: flex-start;
                flex-direction: column;
            }
        }

    </style>

</head>


<body>


<div class="box">


    <!-- ICONO -->

    <div class="icono-pago">
        ✓
    </div>


    <!-- TÍTULO -->

    <h1>
        Pago realizado
    </h1>


    <p class="mensaje">
        Tu pedido fue registrado correctamente.
    </p>


    <!-- DETALLE -->

    <div class="detalle">


        <p>
            <b>Cliente:</b>
            {{ pedido.cliente }}
        </p>


        <p>
            <b>Método:</b>
            {{ pedido.metodo_pago }}
        </p>


        <p class="total">

            <span>
                <b>Total:</b>
            </span>

            <strong>
                S/ {{ "%.2f"|format(pedido.total|float) }}
            </strong>

        </p>


        <p>

            <b>Estado:</b>

            <span class="estado">
                ✓ {{ pedido.estado }}
            </span>

        </p>


    </div>


    <!-- BOTÓN -->

    <a
        href="/mis_pedidos"
        class="btn-main"
    >
        📦 Ver mis pedidos
    </a>


</div>

<script 
src="{{ url_for('static', filename='js/bloqueo_botones.js') }}">
</script>


</body>
</html>
