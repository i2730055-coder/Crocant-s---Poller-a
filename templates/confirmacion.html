<!DOCTYPE html>
<html>
<head>
    <title>Pedido realizado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #2b0f0f, #0f0f0f);
            color: white;
        }

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top, rgba(255,60,0,0.25), transparent);
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* 🔥 CARD PRO */
        .box {
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        /* 🔥 CHECK ICON */
        .check {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 🔥 BOTÓN */
        .btn-primary {
            background: linear-gradient(45deg, #ff3c00, #ff7a00);
            border: none;
            font-weight: bold;
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px #ff3c00;
        }

        /* 🔥 TEXTO */
        .metodo {
            color: #ffc107;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container mt-5 text-center">

    <div class="box">

        <!-- 🔥 ICONO PRO -->
        <div class="check">✅</div>

        <h2>Pedido realizado</h2>

        <p class="mt-3">Tu pedido está en preparación 🍗</p>

        <p>
            Método de pago: 
            <span class="metodo">{{ metodo }}</span>
        </p>

        <a href="/carta" class="btn btn-primary mt-3">
            Volver a la carta
        </a>

    </div>

</div>

<script 
src="{{ url_for('static', filename='js/bloqueo_botones.js') }}">
</script>

</body>
</html>
